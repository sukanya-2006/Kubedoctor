apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedoctor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubedoctor-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubedoctor-readonly
subjects:
  - kind: ServiceAccount
    name: kubedoctor
    namespace: default
roleRef:
  kind: ClusterRole
  name: kubedoctor-readonly
  apiGroup: rbac.authorization.k8s.io